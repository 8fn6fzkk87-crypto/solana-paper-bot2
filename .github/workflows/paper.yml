name: Solana Paper Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: solana-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run simulation
        run: python bot.py
      - name: Save state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "Update paper trading report"
            git push
          fi
